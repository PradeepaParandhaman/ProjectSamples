  namespace: llmproxystandalone
  version: 1.0.0
  tags: []
  domain: ai-platform
  labels:
    gatewayTypes:
      - nano
spec:
  models:
    - name: ibm/granite-3-1-8b-base
      targets:
        - target: llmprovider.watsondeploy.ibm/granite-3-1-8b-base
    - name: ibm/granite-4-h-small
      targets:
        - target: llmprovider.watsondeploy.ibm/granite-4-h-small
    - name: ibm/granite-embedding-278m-multilingual
      targets:
        - target: llmprovider.watsondeploy.ibm/granite-embedding-278m-multilingual
    - name: ibm/granite-ttm-1024-96-r2
      targets:
        - target: llmprovider.watsondeploy.ibm/granite-ttm-1024-96-r2
    - name: ibm/granite-ttm-1536-96-r2
      targets:
        - target: llmprovider.watsondeploy.ibm/granite-ttm-1536-96-r2
    - name: ibm/granite-ttm-512-96-r2
      targets:
        - target: llmprovider.watsondeploy.ibm/granite-ttm-512-96-r2
    - name: ibm/slate-125m-english-rtrvr-v2
      targets:
        - target: llmprovider.watsondeploy.ibm/slate-125m-english-rtrvr-v2
    - name: ibm/slate-30m-english-rtrvr-v2
