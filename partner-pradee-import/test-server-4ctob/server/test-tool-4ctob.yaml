kind: MCPTools
apiVersion: api.ibm.com/v1
metadata:
  name: test-tool-4ctob
  namespace: partner-pradee-import
  version: 1.0.0
  tags: []
  domain: mcp
  labels:
    partner: true
spec:
  tools:
    - name: ask_wiki_question
      title: ask_wiki_question
      description: >-
        Ask any question about a GitHub repository's codebase and get an
        AI-powered answer

        grounded in its DeepWiki.
      inputSchema:
        properties:
          repoName:
            anyOf:
              - type: string
              - items:
                  type: string
                type: array
            description: GitHub repository or list of repositories (max 10) in owner/repo
              format.
          question:
            description: The question to ask about the repository.
            type: string
        required:
          - repoName
          - question
        type: object
        additionalProperties: false
