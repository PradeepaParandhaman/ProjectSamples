kind: FreeFlowPolicySequence
apiVersion: api.ibm.com/v1
metadata:
  name: partner-af-policy-sequence
  namespace: partner-ns-af
  version: 1.0.0
  domain: partner
  labels:
    gatewayTypes:
      - nano
    scope: partner
spec:
  main:
    - $kind: LLMRouter
      spec:
        models:
          - name: gp-04
            targets:
              - target: watsonx-test.watsonx.gp-04
          - name: gp-06
            targets:
              - target: watsonx-test.watsonx.gp-06
        strategy: simpleShuffle
      enabled: true
  monitoring:
    $kind: Telemetry
    $ref: partner-ns-af:partner-af-telemetry:1.0.0
